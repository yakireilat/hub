# Builds hub-web on every push to main and deploys it to core-01 (/mesh/data/hub) over the tailnet.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET  Tailscale OAuth client allowed to create tag:ci nodes
#   DEPLOY_SSH_KEY      optional: private key whose .pub is in saytou's ~/.ssh/authorized_keys on core-01.
#                       Without it, the runner uses Tailscale SSH: core-01 tagged tag:hub, and the tailnet
#                       policy's "ssh" section accepts tag:ci → tag:hub as saytou.
#   DEPLOY_KNOWN_HOSTS  optional: output of `ssh-keyscan 100.100.101.1`. Without it, the host key is read
#                       over the tailnet at deploy time (the WireGuard tunnel already proves it is core-01).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hub-web:${{ github.sha }}
  TARGET: saytou@100.100.101.1
  DIR: /mesh/data/hub

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: core-01
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          fi
          if [ -n "$KNOWN" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "${TARGET#*@}" > ~/.ssh/known_hosts
          fi
          ssh -o BatchMode=yes "$TARGET" true
      - name: Copy compose, deploy script and hub.yaml
        # hub.yaml in the repo is the source of truth; services added in the UI live in hub.db, not here.
        run: |
          scp deploy/compose.yml deploy/deploy.sh "$TARGET:$DIR/"
          scp deploy/hub.yaml "$TARGET:$DIR/data/hub.yaml"
      - name: Deploy
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$TARGET" docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          rc=0
          ssh "$TARGET" bash "$DIR/deploy.sh" "$IMAGE" || rc=$?
          ssh "$TARGET" docker logout ghcr.io
          exit $rc
