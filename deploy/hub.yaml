# hub.yaml for core-01. Lives at /mesh/data/hub/data/hub.yaml; restart hub-web after editing.
# Services can also be added, edited and removed on the Services screen; those changes live in hub.db.
# url = where a click goes, health = what the hub checks (internal, so Authelia is not in the way).

nodes:
  # node-exporter runs in Docker, so it reports the container's hostname; match it by scrape target.
  - { id: core-01, instance: "172.19.0.30:9100" }
  - id: niflheim
  - id: bifrost

# node-exporter metrics for the node tiles (CPU, RAM, disk, temperature). Nodes match by hostname;
# set `instance:` on a node when its exporter's instance label doesn't contain the hostname.
prometheus: http://prometheus:9090

services:
  # core-01
  - { name: n8n, url: https://n8n.mesh.net, health: http://n8n:5678/healthz }
  - { name: Gitea, url: https://git.mesh.net, health: http://gitea:3000/api/healthz }
  - { name: Vaultwarden, url: https://vault.mesh.net, health: http://vaultwarden:80/alive }
  - { name: Uptime Kuma, url: https://status.mesh.net, health: http://uptimekuma:3001/ }
  - { name: Pi-hole, url: https://dns.mesh.net, health: http://pihole:80/admin/ }
  - { name: Authelia, url: https://auth.mesh.net, health: http://authelia:9091/api/health }
  - { name: Grafana, url: https://metrics.mesh.net, health: http://grafana:3000/api/health }
  - { name: Prometheus, url: https://prom.mesh.net, health: http://prometheus:9090/-/healthy }
  - { name: Syncthing, url: https://sync.mesh.net, health: http://syncthing:8384/rest/noauth/health }
  - { name: code-server, url: https://code.mesh.net, health: http://code-server:8080/healthz }
  - { name: Woodpecker CI, url: https://ci.mesh.net, health: http://woodpecker-server:8000/healthz }
  - { name: Mesh dashboard, url: https://mesh.net, health: http://mesh-dashboard:3000/ }
  # Not web apps: tcp:// checks that the port accepts a connection, ping:// sends one ICMP echo.
  - { name: Redis, url: "tcp://redis:6379" }
  - { name: Unbound, url: "tcp://unbound:53" }
  # niflheim
  - { name: Jellyfin, node: niflheim, url: https://media.mesh.net, health: http://100.100.101.100:8096/health }
  - { name: Jellyseerr, node: niflheim, url: https://request.mesh.net, health: http://100.100.101.100:5055/ }
  - { name: Sonarr, node: niflheim, url: https://sonarr.mesh.net, health: http://100.100.101.100:8989/ }
  - { name: Radarr, node: niflheim, url: https://radarr.mesh.net, health: http://100.100.101.100:7878/ }
  - { name: Prowlarr, node: niflheim, url: https://prowlarr.mesh.net, health: http://100.100.101.100:9696/ }
  - { name: qBittorrent, node: niflheim, url: https://torrent.mesh.net, health: http://100.100.101.100:8082/ }
  - { name: Bazarr, node: niflheim, url: https://bazarr.mesh.net, health: http://100.100.101.100:6767/ }
  - { name: Dozzle, node: niflheim, url: https://dozzle.mesh.net, health: http://100.100.101.100:8085/ }
  - { name: FlareSolverr, node: niflheim, url: "http://100.100.101.100:8191", health: "http://100.100.101.100:8191/health" }
  # bifrost
  - { name: Luma, node: bifrost, url: https://luma.mesh.net, health: http://100.100.101.10:8000/ }

inbox_rules:
  # A core-01 service down needs you; the other nodes are often off on purpose, so they stay FYI.
  - match: { source: checks, status: error, node: core-01 }
    route: needs_action
