# The hub on core-01. The Deploy workflow copies this file to /mesh/data/hub and runs deploy.sh there.
name: hub

services:
  hub-web:
    image: ${HUB_IMAGE:?set by deploy.sh}
    container_name: hub-web
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 256m
    env_file:
      - path: .env
        required: false
    environment:
      HUB_DATA_DIR: /data
    volumes:
      - ./data:/data
    networks: [mesh]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Push notifications. iOS delivery goes through the upstream ntfy.sh server; messages stay here.
  ntfy:
    image: binwiederhier/ntfy:v2.34.0
    container_name: ntfy
    command: serve
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 64m
    environment:
      NTFY_BASE_URL: https://ntfy.mesh.net
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
    volumes:
      - ./ntfy:/var/lib/ntfy
    networks: [mesh]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/v1/health | grep -q '\"healthy\":true'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Shared with nginx, so it can proxy hub.mesh.net to hub-web:3000.
  mesh:
    name: services_mesh_net
    external: true
