# hub.mesh.net server block, applied on core-01 to /mesh/configs/nginx.conf (inside http {}, before the catch-all).
# Uses /api/authz/auth-request: nginx auth_request needs a 401, forward-auth answers 302.
  # ── Hub ──────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name hub.mesh.net;

    ssl_certificate     /etc/nginx/certs/mesh.net.crt;
    ssl_certificate_key /etc/nginx/certs/mesh.net.key;

    error_page 404 /error.html;
    error_page 500 502 503 504 /error-auth.html;
    location = /error.html      { root /etc/nginx/assets; internal; }
    location = /error-auth.html { root /etc/nginx/assets; internal; }

    location /authelia {
      internal;
      proxy_pass http://authelia:9091/api/authz/auth-request;
      proxy_set_header X-Original-Method  $request_method;
      proxy_set_header X-Original-URL     $scheme://$http_host$request_uri;
      proxy_set_header X-Forwarded-Method $request_method;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Forwarded-Host   $http_host;
      proxy_set_header X-Forwarded-URI    $request_uri;
      proxy_set_header X-Forwarded-For    $remote_addr;
      proxy_set_header Content-Length     "";
      proxy_set_header Connection         "";
    }

    location / {
      auth_request /authelia;
      error_page 401 =302 https://auth.mesh.net/?rd=$scheme://$http_host$request_uri;
      error_page 500 /error-auth.html;

      # Resolved per request, so nginx still starts if hub-web is down.
      resolver 127.0.0.11 valid=30s;
      set $hub http://hub-web:3000;
      proxy_pass $hub;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
