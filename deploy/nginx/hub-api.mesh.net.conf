# hub-api.mesh.net server block, applied on core-01 to /mesh/configs/nginx.conf (inside http {}, before the catch-all).
# The way in for system users (scripts, Home Assistant, n8n, agents). No Authelia: machines can't pass a
# login page. nginx lets through only /api/v1 requests that carry a hub token; the hub checks the token,
# its scopes and expiry, and logs every call (Settings → API). Still tailnet-only, like everything on core-01.
  # ── Hub API ──────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=hub_api:1m rate=10r/s;

  server {
    listen 443 ssl;
    server_name hub-api.mesh.net;

    ssl_certificate     /etc/nginx/certs/mesh.net.crt;
    ssl_certificate_key /etc/nginx/certs/mesh.net.key;

    location /api/v1/ {
      # A cheap first filter; the hub does the real check.
      if ($http_authorization !~ "^Bearer hub_") {
        add_header WWW-Authenticate 'Bearer realm="hub"' always;
        return 401;
      }
      limit_req zone=hub_api burst=20 nodelay;
      client_max_body_size 1m;

      # Resolved per request, so nginx still starts if hub-web is down.
      resolver 127.0.0.11 valid=30s;
      set $hub http://hub-web:3000;
      proxy_pass $hub;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      # Tells the hub this came from outside Authelia: it then always needs a token.
      proxy_set_header X-Hub-Via api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Nothing else lives here: no screens, no health page.
    location / { return 404; }
  }
