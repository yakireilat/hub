# couch.mesh.net server block, applied on core-01 to /mesh/configs/nginx.conf (inside http {}, before the catch-all).
# No Authelia: the Obsidian apps can't pass a login page, so CouchDB's own login guards it (and the tailnet).
  # ── Couch (CouchDB for Obsidian LiveSync) ───────────────
  server {
    listen 443 ssl;
    server_name couch.mesh.net;

    ssl_certificate     /etc/nginx/certs/mesh.net.crt;
    ssl_certificate_key /etc/nginx/certs/mesh.net.key;

    # Attachments (images, PDFs) can be large; live sync holds long requests open.
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
      # Resolved per request, so nginx still starts and reloads if couchdb is down.
      resolver 127.0.0.11 valid=30s;
      set $couch http://couchdb:5984;
      proxy_pass $couch;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
