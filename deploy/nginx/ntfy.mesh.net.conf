# ntfy.mesh.net server block, applied on core-01 to /mesh/configs/nginx.conf (inside http {}, before the catch-all).
# No Authelia: the ntfy apps can't pass a login page, so ntfy's own users and tokens guard it (deny-all by default).
  # ── ntfy ─────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name ntfy.mesh.net;

    ssl_certificate     /etc/nginx/certs/mesh.net.crt;
    ssl_certificate_key /etc/nginx/certs/mesh.net.key;

    client_max_body_size 20m;

    location / {
      # Resolved per request, so nginx still starts if ntfy is down.
      resolver 127.0.0.11 valid=30s;
      set $ntfy http://ntfy:8080;
      proxy_pass $ntfy;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3m;
      proxy_send_timeout 3m;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
